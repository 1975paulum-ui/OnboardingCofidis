<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="ret.title">Vérification terminée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #E2001A;
    --ink: #22252E;
    --muted: #6B6F7B;
    --paper: #FFFFFF;
    --ok: #1C7C4A;
    --warn: #A8620A;
    --bad: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Figtree", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    padding: 24px;
  }
  main { max-width: 420px; text-align: center; }
  .mark {
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center;
    margin: 0 auto 20px;
    color: #fff; background: var(--ok);
    font-size: 28px; font-weight: 700;
  }
  .mark.warn { background: var(--warn); }
  .mark.bad  { background: var(--bad); }
  h1 { font-size: 24px; margin: 0 0 8px; line-height: 1.2; }
  p  { margin: 0 0 6px; color: var(--muted); line-height: 1.5; }
  .ref { margin-top: 18px; font-size: 13px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="mark" id="mark">✓</div>
  <h1 id="title">Nous avons bien reçu votre vérification</h1>
  <p id="text">Vous pouvez fermer cet écran. Nous vous préviendrons lorsque l'examen sera terminé.</p>
  <p class="ref" id="ref"></p>
</main>
<script src="/i18n.js"></script>
<script>
  const q = Object.fromEntries(new URLSearchParams(location.search));
  const status = (q.status || '').toUpperCase();

  // Textos según el estado final; el idioma es el elegido en la demo (guardado en el navegador)
  let kind = 'received';
  if (['REJECTED', 'FAILED', 'ERROR', 'EXPIRED', 'CANCELLED', 'CANCELED'].includes(status)) kind = 'bad';
  else if (['ABORTED', 'INCOMPLETE'].includes(status)) kind = 'partial';
  else if (['RUNNING', 'PENDING', 'WAITING', 'IN_REVIEW'].includes(status)) kind = 'review';

  const KEYS = {
    received: ['ret.received', 'ret.close'],
    bad: ['ret.badTitle', 'ret.badText'],
    partial: ['ret.partialTitle', 'ret.partialText'],
    review: ['ret.reviewTitle', 'ret.reviewText'],
  };

  function render() {
    const mark = document.getElementById('mark');
    mark.textContent = kind === 'bad' || kind === 'partial' ? '!' : '✓';
    mark.className = 'mark' + (kind === 'bad' ? ' bad' : kind === 'partial' ? ' warn' : '');
    document.getElementById('title').textContent = t(KEYS[kind][0]);
    document.getElementById('text').textContent = t(KEYS[kind][1]);
    document.getElementById('ref').innerHTML = status
      ? esc(t('ret.status')) + '<code>' + esc(status) + '</code>'
      : '';
  }
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  applyI18n();
  render();

  // Avisamos a la web de la demo para que muestre el retorno en la consola
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'namirial-return', params: q }, location.origin);
  }
</script>
</body>
</html>
